name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mysql, redis, intl, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis, level 8)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
        env:
          PAO_DISABLE: '1'

      - name: Pest (PHP tests)
        run: php artisan test --compact

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Prettier (formatting)
        run: npm run format:check

      - name: ESLint (linting)
        run: npm run lint:check

      - name: TypeScript (tsc --noEmit)
        run: npm run types:check

      - name: Vitest (frontend tests)
        run: npm run test
